<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#091428" />
      <stop offset="100%" stop-color="#030711" />
    </linearGradient>

    <filter id="taskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base UI Background -->
  <rect width="1200" height="750" rx="16" fill="url(#taskBg)" stroke="#162948" stroke-width="2" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" rx="16" fill="#071224" />
  <circle cx="40" cy="30" r="7" fill="#EF4444" opacity="0.8" />
  <circle cx="65" cy="30" r="7" fill="#F59E0B" opacity="0.8" />
  <circle cx="90" cy="30" r="7" fill="#10B981" opacity="0.8" />
  <text x="140" y="36" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="16">KANBAN<tspan fill="#22D3EE">FLOW</tspan></text>

  <!-- Board Header -->
  <g transform="translate(50, 90)">
    <text x="0" y="25" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold">Sprint 42: Production Launch</text>
    <rect x="940" y="0" width="160" height="36" rx="8" fill="#22D3EE" opacity="0.9" />
    <text x="1020" y="23" fill="#03050B" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">+ Add Task</text>
  </g>

  <!-- 3 Kanban Columns -->
  <!-- Column 1: Backlog -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="340" height="550" rx="12" fill="#091326" stroke="#182A4D" stroke-width="1.5" />
    <circle cx="25" cy="30" r="6" fill="#64748B" />
    <text x="45" y="35" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">BACKLOG (4)</text>
    
    <!-- Task Card 1 -->
    <rect x="15" y="60" width="310" height="110" rx="8" fill="#0F1F3D" stroke="#1E3869" stroke-width="1" />
    <text x="30" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">API Gateway Refactoring</text>
    <text x="30" y="115" fill="#64748B" font-family="sans-serif" font-size="12">Scale rate-limiters with Redis</text>
    <rect x="30" y="135" width="70" height="20" rx="4" fill="rgba(148, 163, 184, 0.15)" />
    <text x="65" y="149" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Backend</text>

    <!-- Task Card 2 -->
    <rect x="15" y="185" width="310" height="110" rx="8" fill="#0F1F3D" stroke="#1E3869" stroke-width="1" />
    <text x="30" y="215" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">WebAudio Synthesis</text>
    <text x="30" y="240" fill="#64748B" font-family="sans-serif" font-size="12">Dynamic spatial audio clicks</text>
  </g>

  <!-- Column 2: In Progress -->
  <g transform="translate(430, 150)">
    <rect x="0" y="0" width="340" height="550" rx="12" fill="#091326" stroke="#00D2FF" stroke-width="1.5" filter="url(#taskGlow)" opacity="0.95" />
    <circle cx="25" cy="30" r="6" fill="#00D2FF" />
    <text x="45" y="35" fill="#00D2FF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">IN PROGRESS (3)</text>
    
    <!-- Task Card 1 (Active Glow) -->
    <rect x="15" y="60" width="310" height="130" rx="8" fill="#0E2548" stroke="#00D2FF" stroke-width="1.5" />
    <text x="30" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Three.js Celestial Spheres</text>
    <text x="30" y="115" fill="#94A3B8" font-family="sans-serif" font-size="12">Shader material & wireframe mesh</text>
    <rect x="30" y="145" width="80" height="22" rx="4" fill="rgba(0, 210, 255, 0.2)" />
    <text x="70" y="160" fill="#00D2FF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Frontend 3D</text>

    <!-- Task Card 2 -->
    <rect x="15" y="205" width="310" height="110" rx="8" fill="#0F1F3D" stroke="#1E3869" stroke-width="1" />
    <text x="30" y="235" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Mobile Drawer Navigation</text>
    <text x="30" y="260" fill="#64748B" font-family="sans-serif" font-size="12">Smooth spring gesture support</text>
  </g>

  <!-- Column 3: Completed -->
  <g transform="translate(810, 150)">
    <rect x="0" y="0" width="340" height="550" rx="12" fill="#091326" stroke="#182A4D" stroke-width="1.5" />
    <circle cx="25" cy="30" r="6" fill="#10B981" />
    <text x="45" y="35" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">COMPLETED (12)</text>
    
    <!-- Task Card 1 -->
    <rect x="15" y="60" width="310" height="110" rx="8" fill="#0F1F3D" stroke="#1E3869" stroke-width="1" />
    <text x="30" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Responsive Design Audit</text>
    <text x="30" y="115" fill="#64748B" font-family="sans-serif" font-size="12">100% Mobile & Desktop parity</text>
    <rect x="30" y="135" width="60" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" />
    <text x="60" y="149" fill="#10B981" font-family="sans-serif" font-size="10" text-anchor="middle">Passed</text>
  </g>
</svg>
