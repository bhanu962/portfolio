<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rpsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B2E" />
      <stop offset="50%" stop-color="#2D124D" />
      <stop offset="100%" stop-color="#1A0B2E" />
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="scissorsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="rpsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#rpsBg)" />

  <circle cx="650" cy="150" r="140" fill="#EC4899" opacity="0.12" filter="url(#rpsGlow)" />
  <circle cx="150" cy="300" r="130" fill="#A855F7" opacity="0.12" filter="url(#rpsGlow)" />

  <!-- Browser Window Frame -->
  <g transform="translate(50, 30)">
    <rect width="700" height="390" rx="16" fill="#150A26" stroke="#371B5C" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="700" height="44" rx="16" fill="#24123E" />
    <path d="M0 30 h700 v14 h-700 Z" fill="#24123E" />
    <circle cx="24" cy="22" r="5" fill="#EF4444" />
    <circle cx="40" cy="22" r="5" fill="#F59E0B" />
    <circle cx="56" cy="22" r="5" fill="#10B981" />
    
    <rect x="80" y="10" width="340" height="24" rx="6" fill="#110720" stroke="#4C2582" stroke-width="1" />
    <text x="96" y="26" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11" font-weight="500">https://github.com/bhanu962/rock-paper-scissors</text>
    
    <rect x="580" y="11" width="105" height="22" rx="11" fill="#A855F7" fill-opacity="0.15" stroke="#A855F7" stroke-width="1" />
    <text x="595" y="26" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SOLO WEB APP</text>

    <!-- Main Game Area -->
    <g transform="translate(30, 65)">
      <!-- Header inside app -->
      <text x="210" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Rock • Paper • Scissors Arena</text>
      
      <!-- Scoreboard Strip -->
      <rect x="120" y="44" width="400" height="50" rx="12" fill="#25133F" stroke="#4C2582" stroke-width="1" />
      <text x="160" y="66" fill="#A855F7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">PLAYER SCORE</text>
      <text x="195" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">5</text>
      
      <text x="310" y="75" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" font-weight="700">VS</text>
      
      <text x="375" y="66" fill="#EC4899" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CPU SCORE</text>
      <text x="408" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">3</text>

      <!-- 3 Choice Cards -->
      <g transform="translate(40, 115)">
        <!-- Rock Card -->
        <g transform="translate(0, 0)">
          <rect width="160" height="135" rx="14" fill="#200F36" stroke="#4C2582" stroke-width="1" />
          <circle cx="80" cy="50" r="32" fill="url(#rockGrad)" />
          <text x="68" y="58" fill="#FFFFFF" font-size="24">✊</text>
          <text x="60" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ROCK</text>
        </g>

        <!-- Paper Card (Selected) -->
        <g transform="translate(195, 0)">
          <rect width="160" height="135" rx="14" fill="#2E164D" stroke="#A855F7" stroke-width="2" />
          <circle cx="80" cy="50" r="32" fill="url(#paperGrad)" />
          <text x="68" y="58" fill="#FFFFFF" font-size="24">✋</text>
          <text x="56" y="105" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PAPER</text>
          <rect x="35" y="116" width="90" height="14" rx="7" fill="#A855F7" />
          <text x="48" y="127" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="800">YOU CHOSE</text>
        </g>

        <!-- Scissors Card -->
        <g transform="translate(390, 0)">
          <rect width="160" height="135" rx="14" fill="#200F36" stroke="#4C2582" stroke-width="1" />
          <circle cx="80" cy="50" r="32" fill="url(#scissorsGrad)" />
          <text x="68" y="58" fill="#FFFFFF" font-size="24">✌️</text>
          <text x="46" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SCISSORS</text>
        </g>
      </g>
    </g>
  </g>
</svg>
