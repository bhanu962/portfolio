<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1035" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#070B16" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#03050B" stop-opacity="1" />
    </radialGradient>
    
    <!-- Neon Lighting Gradients -->
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B74" />
      <stop offset="50%" stop-color="#BA7E55" />
      <stop offset="100%" stop-color="#8F5935" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D2D" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Filters for Intense Glow -->
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" fill="url(#bgGlow)" />

  <!-- Outer Neon Rings Backdrop -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="url(#purpleNeon)" stroke-width="6" opacity="0.85" filter="url(#glowPurple)" />
  <circle cx="400" cy="400" r="350" fill="none" stroke="url(#cyanNeon)" stroke-width="2" stroke-dasharray="12 16" opacity="0.7" />
  
  <!-- Cyber Particle Dots -->
  <g opacity="0.6">
    <circle cx="160" cy="220" r="3" fill="#00D2FF" filter="url(#glowCyan)" />
    <circle cx="640" cy="260" r="3.5" fill="#D946EF" filter="url(#glowPurple)" />
    <circle cx="210" cy="620" r="2.5" fill="#00D2FF" />
    <circle cx="600" cy="580" r="3" fill="#A855F7" />
    <circle cx="400" cy="110" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Character Artwork -->
  <g id="character" transform="translate(0, 30)">
    <!-- Shoulders & Dark Hoodie -->
    <path d="M 210,720 C 230,570 290,510 330,490 L 400,530 L 470,490 C 510,510 570,570 590,720 Z" fill="url(#hoodieGrad)" stroke="#222C42" stroke-width="3" />
    <!-- Hoodie Strings & Rim Glow -->
    <path d="M 210,720 C 230,570 290,510 330,490" fill="none" stroke="#00D2FF" stroke-width="4" opacity="0.8" filter="url(#glowCyan)" />
    <path d="M 590,720 C 570,570 510,510 470,490" fill="none" stroke="#D946EF" stroke-width="4" opacity="0.8" filter="url(#glowPurple)" />

    <!-- Neck -->
    <path d="M 350,470 L 450,470 L 440,530 L 360,530 Z" fill="#8F5935" />
    <path d="M 355,470 L 445,470 L 435,510 L 365,510 Z" fill="url(#skinGrad)" />

    <!-- Head / Face -->
    <ellipse cx="400" cy="380" rx="95" ry="115" fill="url(#skinGrad)" />

    <!-- Hair (Stylized Modern Quiff / Texture) -->
    <path d="M 295,350 C 290,260 330,220 400,215 C 470,215 510,260 505,350 C 490,320 470,290 400,290 C 330,290 310,320 295,350 Z" fill="#121620" />
    <path d="M 320,240 C 350,210 420,210 480,240 C 490,260 480,270 450,260 C 400,245 350,255 320,240 Z" fill="#1E2435" />
    <!-- Hair Neon Highlight -->
    <path d="M 480,240 C 505,270 505,330 500,360" fill="none" stroke="#D946EF" stroke-width="3.5" opacity="0.7" filter="url(#glowPurple)" />
    <path d="M 320,240 C 295,270 295,330 300,360" fill="none" stroke="#00D2FF" stroke-width="3.5" opacity="0.7" filter="url(#glowCyan)" />

    <!-- Ears -->
    <ellipse cx="305" cy="385" rx="14" ry="24" fill="#BA7E55" />
    <ellipse cx="495" cy="385" rx="14" ry="24" fill="#BA7E55" />

    <!-- Eyebrows -->
    <path d="M 335,340 Q 365,330 380,345" stroke="#121620" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 465,340 Q 435,330 420,345" stroke="#121620" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <ellipse cx="358" cy="365" rx="12" ry="7" fill="#FFFFFF" />
    <circle cx="360" cy="365" r="6" fill="#1E293B" />
    <circle cx="362" cy="363" r="2" fill="#FFFFFF" />

    <ellipse cx="442" cy="365" rx="12" ry="7" fill="#FFFFFF" />
    <circle cx="440" cy="365" r="6" fill="#1E293B" />
    <circle cx="442" cy="363" r="2" fill="#FFFFFF" />

    <!-- Modern Rectangular Glasses with Neon Refraction -->
    <!-- Left Frame -->
    <rect x="330" y="342" width="58" height="42" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="#0F172A" stroke-width="5" />
    <rect x="330" y="342" width="58" height="42" rx="8" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />
    <!-- Right Frame -->
    <rect x="412" y="342" width="58" height="42" rx="8" fill="rgba(168, 85, 247, 0.08)" stroke="#0F172A" stroke-width="5" />
    <rect x="412" y="342" width="58" height="42" rx="8" fill="none" stroke="#C084FC" stroke-width="1.5" opacity="0.8" />
    <!-- Bridge -->
    <path d="M 388,358 Q 400,352 412,358" fill="none" stroke="#0F172A" stroke-width="5" />
    <path d="M 388,358 Q 400,352 412,358" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Glasses Glare -->
    <line x1="336" y1="378" x2="350" y2="348" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
    <line x1="418" y1="378" x2="432" y2="348" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 400,365 L 396,402 L 406,402" fill="none" stroke="#8F5935" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Confident Smile & Trimmed Beard / Stubble -->
    <path d="M 370,432 Q 400,455 430,432" fill="none" stroke="#5A2E1A" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 376,432 Q 400,446 424,432" fill="#FFFFFF" opacity="0.95" />

    <!-- Subtle Clean Beard Shadow -->
    <path d="M 335,400 C 350,470 450,470 465,400 C 455,480 345,480 335,400 Z" fill="#121620" opacity="0.4" />
  </g>
</svg>
