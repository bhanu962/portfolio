<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1E" />
      <stop offset="50%" stop-color="#120D2C" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" rx="16" fill="url(#aiBg)" stroke="#272F4E" stroke-width="2" />

  <!-- App Header / Window Controls -->
  <rect x="0" y="0" width="1200" height="60" rx="16" fill="#0A0E24" />
  <circle cx="40" cy="30" r="7" fill="#EF4444" opacity="0.8" />
  <circle cx="65" cy="30" r="7" fill="#F59E0B" opacity="0.8" />
  <circle cx="90" cy="30" r="7" fill="#10B981" opacity="0.8" />
  <rect x="350" y="16" width="500" height="28" rx="8" fill="#141B3B" stroke="#25325E" stroke-width="1" />
  <text x="600" y="35" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle">ai-telemetry.insight.cloud/dashboard</text>

  <!-- Sidebar -->
  <rect x="25" y="85" width="220" height="640" rx="12" fill="#0B1028" stroke="#1D274A" stroke-width="1.5" />
  <rect x="45" y="115" width="180" height="36" rx="8" fill="rgba(168, 85, 247, 0.2)" stroke="#A855F7" stroke-width="1" />
  <text x="80" y="138" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Overview</text>
  <circle cx="60" cy="133" r="5" fill="#A855F7" />

  <rect x="45" y="165" width="180" height="36" rx="8" fill="#121833" />
  <text x="80" y="188" fill="#64748B" font-family="sans-serif" font-size="14">Neural Metrics</text>
  <rect x="45" y="215" width="180" height="36" rx="8" fill="#121833" />
  <text x="80" y="238" fill="#64748B" font-family="sans-serif" font-size="14">Data Pipeline</text>
  <rect x="45" y="265" width="180" height="36" rx="8" fill="#121833" />
  <text x="80" y="288" fill="#64748B" font-family="sans-serif" font-size="14">System Logs</text>

  <!-- Top Metrics Cards -->
  <g transform="translate(270, 85)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="130" rx="12" fill="#0E1433" stroke="#253059" stroke-width="1.5" />
    <text x="25" y="38" fill="#94A3B8" font-family="sans-serif" font-size="13">TOTAL INFERENCES</text>
    <text x="25" y="80" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold">2.48M</text>
    <text x="25" y="108" fill="#10B981" font-family="sans-serif" font-size="12">+18.4% this week</text>
    <circle cx="240" cy="40" r="16" fill="rgba(168, 85, 247, 0.2)" />
    <text x="240" y="45" fill="#A855F7" font-size="14" text-anchor="middle">⚡</text>

    <!-- Card 2 -->
    <rect x="305" y="0" width="280" height="130" rx="12" fill="#0E1433" stroke="#253059" stroke-width="1.5" />
    <text x="330" y="38" fill="#94A3B8" font-family="sans-serif" font-size="13">AVG LATENCY</text>
    <text x="330" y="80" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold">34.2 ms</text>
    <text x="330" y="108" fill="#38BDF8" font-family="sans-serif" font-size="12">Ultra-responsive</text>
    <circle cx="545" cy="40" r="16" fill="rgba(56, 189, 248, 0.2)" />
    <text x="545" y="45" fill="#38BDF8" font-size="14" text-anchor="middle">⏱</text>

    <!-- Card 3 -->
    <rect x="610" y="0" width="280" height="130" rx="12" fill="#0E1433" stroke="#253059" stroke-width="1.5" />
    <text x="635" y="38" fill="#94A3B8" font-family="sans-serif" font-size="13">ACCURACY SCORE</text>
    <text x="635" y="80" fill="#A855F7" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold">99.4%</text>
    <text x="635" y="108" fill="#A855F7" font-family="sans-serif" font-size="12">Model v4.2 Stable</text>
    <circle cx="850" cy="40" r="16" fill="rgba(168, 85, 247, 0.2)" />
    <text x="850" y="45" fill="#A855F7" font-size="14" text-anchor="middle">🎯</text>
  </g>

  <!-- Large Main Analytics Chart -->
  <g transform="translate(270, 240)">
    <rect x="0" y="0" width="890" height="485" rx="12" fill="#0C122C" stroke="#243058" stroke-width="1.5" />
    <text x="30" y="45" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold">Realtime AI Neural Throughput</text>
    
    <!-- Grid Lines -->
    <line x1="30" y1="120" x2="860" y2="120" stroke="#1C2647" stroke-dasharray="6 6" />
    <line x1="30" y1="200" x2="860" y2="200" stroke="#1C2647" stroke-dasharray="6 6" />
    <line x1="30" y1="280" x2="860" y2="280" stroke="#1C2647" stroke-dasharray="6 6" />
    <line x1="30" y1="360" x2="860" y2="360" stroke="#1C2647" stroke-dasharray="6 6" />

    <!-- Wave Chart Path Area -->
    <path d="M 50,380 Q 150,220 250,310 T 450,160 T 650,220 T 840,110 L 840,430 L 50,430 Z" fill="url(#chartArea)" />
    <path d="M 50,380 Q 150,220 250,310 T 450,160 T 650,220 T 840,110" fill="none" stroke="url(#purpleGradient)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Wave Chart Secondary Line -->
    <path d="M 50,320 Q 150,340 250,250 T 450,290 T 650,170 T 840,240" fill="none" stroke="#00D2FF" stroke-width="2.5" opacity="0.8" />

    <!-- Data Points -->
    <circle cx="250" cy="310" r="6" fill="#D946EF" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="450" cy="160" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="650" cy="220" r="6" fill="#A855F7" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="840" cy="110" r="7" fill="#00D2FF" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />
  </g>
</svg>
